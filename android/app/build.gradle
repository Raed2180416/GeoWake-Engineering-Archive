plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def googleMapsApiKey = keystoreProperties['googleMapsApiKey'] ?: ''
def adMobAppId = keystoreProperties['adMobAppId'] ?: ''
def testAdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
def ringtoneDir = new File(rootProject.projectDir.parentFile, 'assets/ringtones')
def unverifiedBrandedRingtones = ringtoneDir.exists() &&
    ringtoneDir.listFiles()?.any { it.name.contains('(One UI)') }

android {
    namespace "com.example.geowake2"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.geowake.app"
        minSdkVersion 24
        targetSdkVersion 36
        // versionCode/versionName flow from pubspec `version: x.y.z+build` via the
        // Flutter Gradle plugin (flutter.versionCode / flutter.versionName).
        // BUGFIX (GAP: build): these were hardcoded to 1 / "1.0", so the pubspec
        // build number never reached Play and every upload after the first was
        // rejected as a duplicate versionCode — no wake-path fix could ever ship.
        // Bump the build number in pubspec (`+N`) to cut a new release.
        versionCode flutter.versionCode
        versionName flutter.versionName

        // Patrol (LeanCode) native E2E: run instrumentation through Patrol's
        // JUnit runner and clear app data between tests via the AndroidX Test
        // Orchestrator (configured under testOptions below).
        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"

        // SECURITY: the Maps key comes ONLY from android/key.properties (gitignored).
        // The previous hardcoded fallback shipped a LIVE key in source control (and
        // it leaked into chat transcripts) — a billing/abuse risk and a Play flag.
        // An empty fallback fails loudly (maps blank) instead of shipping a secret.
        // Rotate any previously exposed key and put the replacement here.
        manifestPlaceholders = [
            googleMapsApiKey: googleMapsApiKey,
            // Debug/local APKs use Google's demo app id. A Play-bound bundle
            // fails closed below unless a real id is supplied in key.properties.
            adMobAppId: adMobAppId ?: testAdMobAppId,
            // Custom Application (extends FlutterApplication) that creates the
            // notification channels in onCreate — for EVERY process start, so the
            // backstop alarm channel exists even when the exact-alarm backstop
            // fires from the background service after a reboot with no UI launch.
            applicationName: 'com.example.geowake2.GeoWakeApplication'
        ]
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // If you use R8 in release builds, ensure the proguard file is included:
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            // Signing policy:
            //  - Real release keystore in key.properties  -> sign with it.
            //  - No keystore                               -> fall back to the
            //    debug key so `flutter build apk --release` still produces an
            //    installable lean APK for local testing.
            //  - BUT a Play-bound artifact (an .aab bundle task, or an explicit
            //    -PgeowakeRelease=true) MUST NEVER be debug-signed — Play
            //    rejects debug-signed uploads and a debug key must never reach
            //    users. In that case, fail the build loudly instead.
            def wantsBundle = gradle.startParameter.taskNames.any {
                it.toLowerCase().contains('bundle')
            }
            def forceRelease = project.hasProperty('geowakeRelease') &&
                project.property('geowakeRelease').toString().toBoolean()
            if (wantsBundle || forceRelease) {
                if (unverifiedBrandedRingtones) {
                    throw new GradleException(
                        "Refusing to build a Play release artifact while " +
                        "Samsung One UI-named ringtone files have no checked-in " +
                        "license/provenance. Replace them with owned or properly " +
                        "licensed alarm audio before release.")
                }
                if (!googleMapsApiKey) {
                    throw new GradleException(
                        "Refusing to build a Play release artifact without " +
                        "googleMapsApiKey in android/key.properties.")
                }
                if (!adMobAppId) {
                    throw new GradleException(
                        "Refusing to build a Play release artifact with the " +
                        "AdMob DEMO app id. Add adMobAppId to " +
                        "android/key.properties.")
                }
            }
            if (keystoreProperties['storeFile'] != null) {
                signingConfig signingConfigs.release
            } else {
                if (wantsBundle || forceRelease) {
                    throw new GradleException(
                        "Refusing to build a Play release artifact with the DEBUG " +
                        "signing key. Configure a real release keystore in " +
                        "android/key.properties (storeFile/storePassword/keyAlias/" +
                        "keyPassword) before building an .aab or passing " +
                        "-PgeowakeRelease=true.")
                }
                println("WARNING: no release keystore in key.properties — this " +
                    "release build is DEBUG-SIGNED and is for local testing ONLY.")
                signingConfig signingConfigs.debug
            }
        }
    }

    signingConfigs {
        if (keystoreProperties['storeFile'] != null) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    // Patrol (LeanCode) native E2E: run instrumentation under the AndroidX Test
    // Orchestrator so each test runs in its own instrumentation and app data is
    // cleared between tests (clearPackageData in defaultConfig).
    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"

    // Desugaring support library
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Patrol (LeanCode) native E2E: AndroidX Test Orchestrator runtime. Required
    // for `testOptions { execution "ANDROIDX_TEST_ORCHESTRATOR" }` above —
    // installs the orchestrator APK so each Patrol test runs isolated and
    // clearPackageData works. (Version matches patrol 4.7.1's example.) The
    // JUnit + PatrolJUnitRunner deps come transitively from the patrol plugin.
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
}
