name: Corpus — available code verification

# Data-dependent exclusions are explicit in tools/sale/dataset-dependent-tests.json.
# Full historical gates are preserved in docs/archive/ci-before-corpus.yml.txt.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  available-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: geowake-server/package-lock.json
      - name: Available code, analysis and both backends
        run: python3 tools/sale/verify.py --profile code --out "$RUNNER_TEMP/geowake-verification"
      - name: Publish measured Flutter and Express line coverage
        run: >-
          python3 tools/sale/report_coverage.py
          --verification-dir "$RUNNER_TEMP/geowake-verification"
          --out "$RUNNER_TEMP/geowake-verification/coverage"
          --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --job-summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve standard coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/geowake-verification/coverage
      - name: Preserve the exact check receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: available-code-verification
          path: ${{ runner.temp }}/geowake-verification

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep — SAST + invariant protection
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml
